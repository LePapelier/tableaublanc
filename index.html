<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tableau blanc — dessin collaboratif, LaTeX et PDF</title>
  <meta name="description" content="Un tableau blanc partagé pour dessiner à plusieurs, écrire des formules en LaTeX et annoter des PDF. Sans compte ni serveur : les navigateurs se connectent directement entre eux.">
  <meta name="color-scheme" content="light">
  <meta name="build" content="dev">
  <link rel="canonical" href="https://paul-laurent.fr/">
  <meta property="og:url" content="https://paul-laurent.fr/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tableau blanc">
  <meta property="og:title" content="Tableau blanc — dessin collaboratif, LaTeX et PDF">
  <meta property="og:description" content="Dessinez à plusieurs, écrivez en LaTeX, annotez vos PDF. Sans compte, sans serveur, directement entre navigateurs.">
  <meta property="og:image" content="https://paul-laurent.fr/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tableau blanc — dessin collaboratif, LaTeX et PDF">
  <meta name="twitter:description" content="Dessinez à plusieurs, écrivez en LaTeX, annotez vos PDF. Sans compte, sans serveur.">
  <meta name="twitter:image" content="https://paul-laurent.fr/og.png">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tableau">
</head>
<body>
  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;font-family:system-ui,sans-serif;padding:24px;text-align:center">Ce tableau blanc a besoin de JavaScript pour fonctionner.</p></noscript>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay"></div>
    <div id="cursors"></div>
    <div id="marquee" hidden></div>
    <div id="selection" hidden>
      <div class="handle nw"></div><div class="handle ne"></div><div class="handle sw"></div><div class="handle se"></div>
      <div class="rotate"></div>
    </div>
    <textarea id="editor" hidden spellcheck="false" placeholder="Texte"></textarea>
  </div>

  <div id="selbar" hidden>
    <button id="sel-dup" class="text" title="Dupliquer (Ctrl+D)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg><span>Dupliquer</span></button>
    <button id="sel-more" class="icon" title="Plus d’actions (ordre, rotation…)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></svg></button>
    <button id="sel-del" class="text danger" title="Supprimer (Suppr)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg><span>Supprimer</span></button>
  </div>

  <header id="topbar" aria-label="Barre principale">
    <div class="group">
      <button id="btn-undo" class="icon" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></svg></button>
      <button id="btn-redo" class="icon" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" /></svg></button>
      <span class="sep"></span>
      <button id="btn-zoom-out" class="icon" title="Zoom arrière"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="8" x2="14" y1="11" y2="11" /></svg></button>
      <button id="btn-zoom-fit" class="text" title="Recadrer sur tout le tableau"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg><span class="zoom-value">100 %</span></button>
      <button id="btn-zoom-in" class="icon" title="Zoom avant"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" /></svg></button>
      <span class="sep"></span>
      <button id="btn-clear" class="text danger" title="Effacer tout le tableau"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg><span>Tout effacer</span></button>
    </div>
    <div class="group">
      <div id="users" title="Participants"></div>
      <ul id="users-list" hidden></ul>
      <button id="btn-name" class="text" title="Changer de nom">Moi</button>
      <button id="btn-share" class="text primary" title="Copier le lien de la salle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /></svg><span>Partager</span></button>
      <button id="btn-menu" class="icon" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></svg></button>
    </div>
    <div id="menu" hidden>
      <button data-action="#btn-new-room"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>Nouvelle salle</button>
      <button data-action="#btn-join-room"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 17 5-5-5-5" /><path d="M15 12H3" /><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /></svg>Rejoindre une salle…</button>
      <span class="sep"></span>
      <button data-action="#btn-save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" /><path d="M7 3v4a1 1 0 0 0 1 1h7" /></svg>Enregistrer la session</button>
      <button data-action="#btn-open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></svg>Ouvrir une session…</button>
      <button data-action="#btn-preamble-open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 12.5 8 15l2 2.5" /><path d="m14 12.5 2 2.5-2 2.5" /></svg>Charger un préambule LaTeX…</button>
      <button data-action="#btn-preamble"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1" /><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1" /></svg>Préambule LaTeX…</button>
      <button data-action="#btn-export-pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M12 18v-6" /><path d="m9 15 3 3 3-3" /></svg>Exporter en PDF</button>
      <span class="sep compact-only"></span>
      <button data-action="#btn-name" class="compact-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 15H7a4 4 0 0 0-4 4v2" /><path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /><circle cx="10" cy="7" r="4" /></svg>Changer de nom</button>
      <button data-action="#btn-zoom-fit" class="compact-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg>Tout afficher</button>
      <button data-action="#btn-clear" class="danger compact-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>Tout effacer</button>
    </div>
    <button id="btn-save" hidden></button>
    <button id="btn-new-room" hidden></button>
    <button id="btn-join-room" hidden></button>
    <button id="btn-preamble" hidden></button>
    <label id="btn-preamble-open" hidden><input id="preamble-input" type="file" accept=".tex,.sty,.txt,.cls,text/plain"></label>
    <button id="btn-export-pdf" hidden></button>
    <label id="btn-open" hidden><input id="session-input" type="file" accept="application/json,.json"></label>
  </header>

  <nav id="toolbar" aria-label="Outils">
    <button id="toolbar-toggle" title="Replier / déplier la barre d’outils"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
    <div class="tools">
    <button class="tool" data-tool="select" title="Sélection (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" /></svg></button>
    <button class="tool" data-tool="lasso" title="Lasso (L) : entourer à main levée"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.704 14.467a10 8 0 1 1 3.115 2.375" /><path d="M7 22a5 5 0 0 1-2-3.994" /><circle cx="5" cy="16" r="2" /></svg></button>
    <button class="tool" data-tool="pen" title="Crayon (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg></button>
    <button class="tool" data-tool="marker" title="Surligneur (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3" /><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" /></svg></button>
    <button class="tool" data-tool="eraser" title="Gomme (E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21" /><path d="m5.082 11.09 8.828 8.828" /></svg></button>
    <button class="tool" data-tool="text" title="Texte et LaTeX (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16" /><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2" /><path d="M9 20h6" /></svg></button>
    <button class="tool" data-tool="hand" title="Déplacer la vue (Espace)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" /><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" /><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" /><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></svg></button>
    <span class="sep"></span>
    <label class="tool file" title="Insérer un PDF ou une image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.35 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v5.35" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M14 19h6" /><path d="M17 16v6" /></svg>
      <input id="pdf-input" type="file" accept="application/pdf,image/*" multiple hidden>
    </label>
    </div>

    <div id="options">
      <div id="colors"></div>
      <div id="sizes" title="Épaisseur du trait"></div>
      <div id="font-sizes" title="Taille du texte" hidden></div>
    </div>
  </nav>

  <dialog id="preamble-dialog">
    <h3>Préambule LaTeX</h3>
    <p class="muted">Macros partagées avec toute la salle : <code>\newcommand</code>, <code>\def</code>, <code>\DeclareMathOperator</code>…
      <code>\usepackage</code> est accepté pour les packages couverts par KaTeX ; <code>bussproofs</code> (<code>\begin{prooftree}</code>) et <code>mhchem</code> (<code>\ce</code>) sont émulés.</p>
    <textarea id="preamble-text" spellcheck="false" placeholder="\newcommand{\R}{\mathbb{R}}&#10;\DeclareMathOperator{\Ker}{Ker}&#10;\usepackage{bussproofs}"></textarea>
    <div id="preamble-status" class="muted"></div>
    <div class="actions">
      <button type="button" id="preamble-load" class="text" title="Charger depuis un fichier .tex ou .sty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></svg><span>Charger…</span></button>
      <button type="button" id="preamble-download" class="text" title="Télécharger le préambule courant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg><span>Télécharger</span></button>
      <span class="spacer"></span>
      <button type="button" id="preamble-cancel" class="text">Annuler</button>
      <button type="button" id="preamble-apply" class="text primary">Appliquer</button>
    </div>
  </dialog>

  <div id="ctxmenu" hidden></div>

  <div id="hint" class="muted"></div>
  <div id="status" hidden></div>

  <script src="./vendor/katex/katex.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
